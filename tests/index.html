<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDC Test Runner</title>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 40px;
        }
        .container { max-width: 800px; margin: auto; }
        .summary {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .test-case {
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .passed { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; }
        .failed { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; }
        .status-tag { font-weight: bold; text-transform: uppercase; font-size: 0.75rem; }
        .details { font-size: 0.9rem; color: #94a3b8; }
        #hidden-playground { visibility: hidden; position: absolute; top: -9999px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 CDC Test Runner</h1>
        <div id="test-summary" class="summary">Ejecutando pruebas...</div>
        <div id="test-results"></div>
    </div>

    <!-- Playground for DOM integration tests -->
    <div id="hidden-playground">
        <div id="contenedor_paginas"></div>
    </div>

    <!-- Required Scripts for Engine -->
    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/cdc-core.js"></script>
    <script src="../js/cdc-cards.js"></script>
    <script src="../js/cdc-ui.js"></script>
    <script src="../js/cdc-menus.js"></script>
    <script src="../js/cdc-editor.js"></script>
    <script src="../js/cdc-export.js"></script>
    
    <!-- Test Logic -->
    <script src="tests.js"></script>
</body>
</html>
